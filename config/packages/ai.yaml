ai:
    platform:
        mistral:
            api_key: '%env(MISTRAL_API_KEY)%'

    agent:

    store:
        meilisearch:
            ingredients:
                endpoint: '%env(MEILISEARCH_HOST)%'
                api_key: '%env(MEILISEARCH_API_KEY)%'
                index_name: ingredients
                dimensions: 1024

    vectorizer:
        ingredients:
            platform: ai.platform.mistral
            model: '%env(MISTRAL_EMBEDDING_MODEL)%'

    indexer:
        ingredients:
            vectorizer: ai.vectorizer.ingredients
            store: ai.store.meilisearch.ingredients
