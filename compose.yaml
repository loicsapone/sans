services:
  php:
    build: $PWD/docker/frankenphp
    restart: on-failure
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost, php:80}
    volumes:
      - ./:/srv/app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

  meilisearch:
    image: getmeili/meilisearch:v1.19
    restart: on-failure
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-changeMe}
    ports:
      - "7700"
    volumes:
      - meilisearch_data:/meili_data

volumes:
  meilisearch_data:
